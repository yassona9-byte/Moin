name: Build 3D Android (Godot)

# Compila el juego 3D (carpeta game3d/) a un APK instalable con Godot 4.3
# usando la imagen barichello/godot-ci (Godot + SDK Android + plantillas).
# Se ejecuta al hacer push (main o ramas claude/**) y tambien a mano.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'game3d/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

jobs:
  build-3d:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar plantillas de exportacion
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ] && [ ! -d ~/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          fi
          ls -la ~/.local/share/godot/export_templates/ || true

      - name: Generar keystore de depuracion
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore $GITHUB_WORKSPACE/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Importar y exportar APK
        working-directory: game3d
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          echo "== Importando recursos =="
          godot --headless --import . 2>&1 | tail -n 40 || true
          echo "== Exportando APK =="
          godot --headless --export-debug "Android" build/moin-soccer-3d.apk 2>&1 | tail -n 60
          ls -la build

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: moin-soccer-3d-apk
          path: game3d/build/moin-soccer-3d.apk
          if-no-files-found: error
