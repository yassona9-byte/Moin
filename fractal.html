<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MANDELBULB — flipa en colores</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #000; font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: grab; user-select: none; -webkit-user-select: none;
  }
  body.dragging { cursor: grabbing; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ui {
    position: fixed; pointer-events: none; color: #fff; z-index: 10;
  }
  #title {
    top: 24px; left: 28px;
    font-size: 13px; letter-spacing: 6px; font-weight: 300;
    text-transform: uppercase; opacity: 0.9;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  #title b { font-weight: 700; }
  #hint {
    bottom: 24px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: 2px; opacity: 0.55;
    transition: opacity 2s ease;
  }
  #hint.fade { opacity: 0; }
  #stats {
    top: 24px; right: 28px; font-size: 11px; letter-spacing: 1px;
    opacity: 0.5; text-align: right; font-variant-numeric: tabular-nums;
  }
  #nogl {
    display: none; position: fixed; inset: 0; color: #fff;
    align-items: center; justify-content: center; text-align: center;
    font-size: 16px; padding: 20px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title"><b>MANDELBULB</b> &nbsp;·&nbsp; fractal 3D en tiempo real</div>
<div class="ui" id="hint">arrastra para girar &nbsp;·&nbsp; rueda para zoom &nbsp;·&nbsp; [espacio] pausa la mutación</div>
<div class="ui" id="stats"></div>
<div id="nogl">Tu navegador no soporta WebGL 😢<br>Prueba con Chrome o Firefox actualizados.</div>

<script>
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, depth: false, stencil: false });
if (!gl) {
  document.getElementById('nogl').style.display = 'flex';
  throw new Error('no webgl');
}

const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uPower;
uniform vec2  uRot;     // yaw, pitch
uniform float uDist;    // camera distance
uniform float uHue;     // palette shift

#define MAX_STEPS 110
#define MAX_DIST  12.0
#define SURF      0.0012
#define ITERS     9

// --- Mandelbulb distance estimator con orbit traps para el color ---
float mandelbulb(vec3 pos, out vec4 trap) {
  vec3 z = pos;
  float dr = 1.0;
  float r = 0.0;
  trap = vec4(abs(z), dot(z, z));
  for (int i = 0; i < ITERS; i++) {
    r = length(z);
    if (r > 2.0) break;
    float theta = acos(clamp(z.z / r, -1.0, 1.0)) * uPower;
    float phi   = atan(z.y, z.x) * uPower;
    float zr    = pow(r, uPower);
    dr = pow(r, uPower - 1.0) * uPower * dr + 1.0;
    z = zr * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + pos;
    trap = min(trap, vec4(abs(z), dot(z, z)));
  }
  return 0.5 * log(r) * r / dr;
}

float map(vec3 p, out vec4 trap) {
  return mandelbulb(p, trap);
}

vec3 calcNormal(vec3 p) {
  vec4 t;
  vec2 e = vec2(0.0008, 0.0);
  return normalize(vec3(
    map(p + e.xyy, t) - map(p - e.xyy, t),
    map(p + e.yxy, t) - map(p - e.yxy, t),
    map(p + e.yyx, t) - map(p - e.yyx, t)
  ));
}

float softShadow(vec3 ro, vec3 rd, float k) {
  float res = 1.0;
  float t = 0.01;
  vec4 trap;
  for (int i = 0; i < 32; i++) {
    float h = map(ro + rd * t, trap);
    if (h < 0.0005) return 0.0;
    res = min(res, k * h / t);
    t += clamp(h, 0.004, 0.1);
    if (t > 3.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// paleta cosenoidal (inspirada en Inigo Quilez)
vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  // cámara orbital
  float cy = cos(uRot.x), sy = sin(uRot.x);
  float cp = cos(uRot.y), sp = sin(uRot.y);
  vec3 ro = uDist * vec3(cy * cp, sp, sy * cp);
  vec3 ww = normalize(-ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.6 * ww);

  // raymarch
  float t = 0.0;
  float steps = 0.0;
  vec4 trap = vec4(0.0);
  bool hit = false;
  for (int i = 0; i < MAX_STEPS; i++) {
    vec3 p = ro + rd * t;
    float d = map(p, trap);
    if (d < SURF * t || d < SURF * 0.5) { hit = true; break; }
    t += d * 0.9;
    steps += 1.0;
    if (t > MAX_DIST) break;
  }

  vec3 col;
  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p);

    // color por orbit traps — aquí está la magia psicodélica
    float m1 = clamp(trap.w * 0.7, 0.0, 1.0);
    float m2 = clamp(trap.y * 2.2, 0.0, 1.0);
    float m3 = clamp(trap.z * 2.2, 0.0, 1.0);
    vec3 base = palette(uHue + m1 * 0.45 + m2 * 0.25 + m3 * 0.15);

    // iluminación: sol + cielo + rebote
    vec3 sunDir = normalize(vec3(0.7, 0.9, -0.4));
    float dif = clamp(dot(n, sunDir), 0.0, 1.0);
    float sha = softShadow(p + n * 0.002, sunDir, 18.0);
    float sky = 0.5 + 0.5 * n.y;
    float bou = clamp(-n.y, 0.0, 1.0);
    float ao  = 1.0 - steps / float(MAX_STEPS);
    ao = ao * ao;

    vec3 lin = vec3(0.0);
    lin += dif * sha * vec3(1.35, 1.15, 0.95) * 1.4;
    lin += sky * vec3(0.25, 0.35, 0.55) * ao;
    lin += bou * vec3(0.30, 0.18, 0.25) * ao;
    col = base * lin;

    // brillo especular + fresnel iridiscente
    vec3 hal = normalize(sunDir - rd);
    float spe = pow(clamp(dot(n, hal), 0.0, 1.0), 32.0) * dif * sha;
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 3.0);
    col += spe * vec3(1.0) * 0.8;
    col += fre * palette(uHue + 0.5 + m1) * 0.35 * ao;

    // niebla hacia el fondo
    col = mix(col, vec3(0.01, 0.01, 0.03), 1.0 - exp(-0.06 * t * t));
  } else {
    // fondo: nebulosa suave + glow por densidad de pasos cerca del borde
    float g = steps / float(MAX_STEPS);
    vec3 deep = mix(vec3(0.01, 0.01, 0.035), vec3(0.04, 0.01, 0.07), uv.y * 0.5 + 0.5);
    col = deep + palette(uHue + 0.6) * pow(g, 2.2) * 0.9;
    // estrellas
    vec2 sp2 = floor(gl_FragCoord.xy / 2.0);
    float h = fract(sin(dot(sp2, vec2(12.9898, 78.233))) * 43758.5453);
    if (h > 0.9975) col += vec3(0.6) * (h - 0.9975) * 400.0 * (0.5 + 0.5 * sin(uTime * 2.0 + h * 100.0));
  }

  // tonemap + gamma + viñeta
  col = col / (1.0 + col);
  col = pow(col, vec3(0.4545));
  vec2 q = gl_FragCoord.xy / uRes;
  col *= 0.4 + 0.6 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.2);

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ['uRes','uTime','uPower','uRot','uDist','uHue'])
  U[n] = gl.getUniformLocation(prog, n);

// --- estado interactivo ---
let yaw = 0.6, pitch = 0.25, dist = 3.0;
let targetYaw = yaw, targetPitch = pitch, targetDist = dist;
let dragging = false, lastX = 0, lastY = 0;
let idleTime = 0, morphing = true, morphT = 0;
let renderScale = Math.min(window.devicePixelRatio || 1, 1.5) * 0.7;

const hint = document.getElementById('hint');
const stats = document.getElementById('stats');

function resize() {
  canvas.width  = Math.round(innerWidth  * renderScale);
  canvas.height = Math.round(innerHeight * renderScale);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function pointerDown(x, y) {
  dragging = true; lastX = x; lastY = y;
  document.body.classList.add('dragging');
  hint.classList.add('fade');
}
function pointerMove(x, y) {
  if (!dragging) return;
  targetYaw   += (x - lastX) * 0.005;
  targetPitch += (y - lastY) * 0.005;
  targetPitch = Math.max(-1.45, Math.min(1.45, targetPitch));
  lastX = x; lastY = y;
  idleTime = 0;
}
function pointerUp() {
  dragging = false;
  document.body.classList.remove('dragging');
}
canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); pointerDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', pointerUp);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetDist *= Math.exp(e.deltaY * 0.001);
  targetDist = Math.max(1.4, Math.min(8.0, targetDist));
  idleTime = 0;
  hint.classList.add('fade');
}, { passive: false });
addEventListener('keydown', e => {
  if (e.code === 'Space') { morphing = !morphing; hint.classList.add('fade'); }
});

// --- bucle de render con auto-ajuste de calidad ---
let prev = performance.now(), fpsAcc = 0, fpsN = 0, fpsTimer = 0;
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.1);
  prev = now;
  idleTime += dt;
  if (morphing) morphT += dt;

  // órbita automática cuando no tocas nada
  if (!dragging && idleTime > 2.5) targetYaw += dt * 0.12;

  // suavizado de cámara
  const k = 1.0 - Math.exp(-dt * 8.0);
  yaw   += (targetYaw - yaw) * k;
  pitch += (targetPitch - pitch) * k;
  dist  += (targetDist - dist) * k;

  // la potencia del fractal "respira": de eso va el show
  const power = 8.0 + 3.0 * Math.sin(morphT * 0.18);
  const hue = morphT * 0.012;

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform1f(U.uPower, power);
  gl.uniform2f(U.uRot, yaw, pitch);
  gl.uniform1f(U.uDist, dist);
  gl.uniform1f(U.uHue, hue);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // FPS + calidad adaptativa
  fpsAcc += 1 / Math.max(dt, 1e-4); fpsN++; fpsTimer += dt;
  if (fpsTimer > 1.0) {
    const fps = fpsAcc / fpsN;
    stats.textContent = `${fps.toFixed(0)} fps · potencia ${power.toFixed(2)}`;
    if (fps < 28 && renderScale > 0.35) { renderScale *= 0.85; resize(); }
    else if (fps > 55 && renderScale < 1.2) { renderScale *= 1.08; resize(); }
    fpsAcc = 0; fpsN = 0; fpsTimer = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
